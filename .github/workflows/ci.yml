name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # actions/setup-python v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python QA tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff==0.9.10 mypy==1.15.0 coverage[toml]==7.6.10

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: |
          for file in bootstrap.sh check-client-routes.sh diagnose.sh disable-exit-node.sh enable-exit-node.sh install.sh restore-connector.sh rollback.sh scripts/smoke-test.sh scripts/package.sh scripts/validation-e2e.sh scripts/maintainer/apply-github-ruleset.sh; do
            bash -n "$file"
          done

      - name: Lint shell scripts
        run: |
          shellcheck bootstrap.sh check-client-routes.sh diagnose.sh disable-exit-node.sh enable-exit-node.sh install.sh restore-connector.sh rollback.sh scripts/smoke-test.sh scripts/package.sh scripts/validation-e2e.sh scripts/maintainer/apply-github-ruleset.sh

      - name: Lint and type-check Python
        run: |
          ruff check scripts tests
          mypy scripts

      - name: Run Python unit tests (incl. policy-tool + diagnostics fake-command tests)
        run: |
          python3 -B -m unittest discover -s tests

      - name: Policy-tool CLI + dry-run smoke test
        run: |
          ./scripts/smoke-test.sh

      - name: Docs link check
        run: |
          python3 scripts/check_docs_links.py

      - name: Packaging check
        run: |
          ./scripts/package.sh --check

      - name: Python coverage summary
        if: matrix.python-version == '3.12'
        run: |
          python3 -m coverage run -m unittest discover -s tests
          python3 -m coverage report --fail-under=55
