name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME}"
          file_version="$(cat VERSION)"
          if [ "$tag" != "v$file_version" ]; then
            echo "::error::Tag $tag does not match VERSION (expected v$file_version). Bump VERSION and __version__ first." >&2
            exit 1
          fi
          echo "Releasing $tag"

      - name: Build and verify artifacts
        run: |
          ./scripts/package.sh --check

      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          python3 scripts/changelog_release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG section for ${GITHUB_REF_NAME} is empty." >&2
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
