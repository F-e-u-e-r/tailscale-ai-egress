version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot rewrites both the
  # commit SHA and the inline `# vX.Y.Z` version comment (which is why those
  # comments are on the same line as `uses:`).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
