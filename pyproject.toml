[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
files = ["scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
